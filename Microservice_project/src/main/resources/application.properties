spring.application.name=Microservice-project

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prolance_project?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#server configuration
server.port=8091

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Google Gemini
gemini.api.key=${GEMINI_API_KEY}

jwt.secret=${JWT_SECRET}

# mailling
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=azizsehli068@gmail.com
spring.mail.password=${PROJECT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
# Prometheus monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
