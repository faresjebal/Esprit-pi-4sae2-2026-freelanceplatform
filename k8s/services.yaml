# ── user-service ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: pidev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: faresjebali/pidev_microservices:microservice-user
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: common-env
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: JWT_SECRET
            - name: USER_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: USER_MAIL_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: pidev
spec:
  selector:
    app: user-service
  ports:
    - port: 8084
      targetPort: 8084
---
