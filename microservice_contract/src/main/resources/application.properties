# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8083

# ============================================
# APPLICATION NAME
# ============================================
spring.application.name=microservice-contract

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/prolance_contracts?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&maxAllowedPacket=67108864
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,prometheus,info,prometheus

# ============================================
# ERROR HANDLING CONFIGURATION
# ============================================
spring.web.error.include-stacktrace=always
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=true

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.example.microservice_contract=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================
# EMAIL CONFIGURATION - GMAIL SMTP
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ffaresjebali@gmail.com
spring.mail.password=${CONTRACT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# APPLICATION CONFIGURATION
# ============================================
app.mail.from=ProLance <ffaresjebali@gmail.com>
app.frontend-url=http://localhost:4200
jwt.secret=${JWT_SECRET}

# ============================================
# FEIGN CLIENT CONFIGURATION
# ============================================
proposal.service.url=http://localhost:8092/freelance1
milestone.service.url=http://localhost:8081
# Prometheus monitoring
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

