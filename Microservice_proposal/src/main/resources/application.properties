spring.application.name=Microservice-proposal

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/prolance_proposal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#server configuration
server.port=8092

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

gemini.api.key=${GEMINI_API_KEY}
proposal.expiration.days=7
# JWT ? must match the user microservice secret exactly
jwt.secret=${JWT_SECRET}

# Prometheus monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
